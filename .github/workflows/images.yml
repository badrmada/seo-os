# **The entry point for CI.** Tests, the documentation check and the image build
# all hang off this one file, in that order: `build` declares `needs: [tests,
# docs]`, so a red suite stops the push instead of racing it. They used to be
# three workflows on the same triggers, which meant a merge to `main` published
# an image whether or not the tests that ran alongside it went green.
#
# The tag triggers matter for the same reason. `v*` builds the artifact people
# actually pin, and it now runs the suite first — before, `tests.yml` was
# `branches: [main]` only, and a tag is not a branch, so a release was the one
# build with no test signal at all.
#
# CI's job still ends here, on purpose: **nothing below deploys.** Rolling an
# image out is `docker compose pull && up -d` on the host that runs it
# (deploy/compose/README.md), which needs that host's SSH key and its `.env` —
# credentials this repo would have to hold in order to automate a decision that
# is separate from building anyway.

name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; `build` widens it to publish. Anything added to this
# file starts with no more access than checking out the code.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Called, rather than duplicated, so there is exactly one definition of "the
  # tests" and one of "the docs check". They surface as the status checks
  # `tests / seo-agents` and `docs / check` — those are the names to require in
  # the branch ruleset, and they only appear in the settings UI after this
  # workflow has run at least once.
  tests:
    uses: ./.github/workflows/tests.yml

  docs:
    uses: ./.github/workflows/docs.yml

  build:
    # Named for what it produces. It used to be `${{ matrix.service }}`, which
    # collided with the test job's name — and branch protection matches on that
    # string, so "require seo-agents" was ambiguous between the two.
    name: image (${{ matrix.service }})
    needs: [tests, docs]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write        # only used on a push; a PR never reaches the push step

    strategy:
      fail-fast: false
      matrix:
        # One entry per service that has a Dockerfile. `gateway` and `frontend`
        # join by adding theirs and a line here — which is the whole reason this
        # is a matrix while there is one service in it.
        include:
          - service: seo-agents
            context: services/seo-agents

    steps:
      # Actions are pinned to a commit, with the version in the trailing comment.
      # A tag like `v4` is a moving pointer the upstream owner can repoint at any
      # commit; this repo takes pull requests from strangers, and a mutable
      # third-party action in that setting is the cheapest supply-chain foothold
      # there is. Dependabot bumps these (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # A pull request builds and never publishes: a fork's PR would otherwise
      # push to this project's registry.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          # A PR's image is loaded into the local daemon instead, so the smoke
          # test below has something to run without a second build.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # arm64 costs real time under QEMU, so a PR only proves amd64 builds
          # (and `load` can't take a manifest list anyway); what actually gets
          # deployed is built for both.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      # The image is a CLI with an explicit ENTRYPOINT: a bare run prints help
      # and does nothing. That makes "does it start?" cheap to ask, and it is the
      # check that catches a dependency missing from the image rather than from
      # the tests — the two are not the same list.
      - name: Smoke test
        run: |
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "running: $image --help"
          docker run --rm --pull=missing "$image" --help
