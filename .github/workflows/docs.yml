name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/seo-agents/requirements.txt

      # The command check runs the CLI for real, so the deps have to be here.
      # It lives in services/seo-agents/.venv because that is where check_docs.py
      # looks (after vir/, which is the local convention).
      - name: Install
        run: |
          python -m venv services/seo-agents/.venv
          services/seo-agents/.venv/bin/pip install -q -r services/seo-agents/requirements.txt

      - name: Check documentation
        run: python3 scripts/check_docs.py
