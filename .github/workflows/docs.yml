# The documentation check: every link resolves, and every command a doc claims
# you can run is actually run. **Called, never triggered directly** — see the
# note at the top of `tests.yml` for why the entry point is `images.yml`.

name: docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/seo-agents/requirements.txt

      # The command check runs the CLI for real, so the deps have to be here.
      # It lives in services/seo-agents/.venv because that is where check_docs.py
      # looks (after vir/, which is the local convention).
      - name: Install
        run: |
          python -m venv services/seo-agents/.venv
          services/seo-agents/.venv/bin/pip install -q -r services/seo-agents/requirements.txt

      - name: Check documentation
        run: python3 scripts/check_docs.py
