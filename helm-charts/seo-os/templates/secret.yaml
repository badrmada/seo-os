{{- if and .Values.tenant.secret.enabled (not .Values.tenant.secret.existing) }}
{{- if not (or .Values.tenant.config .Values.tenant.configJson) }}
{{- fail "tenant.config or tenant.configJson is required when tenant.secret.enabled is true — set tenant.secret.enabled=false if the tenant folder comes from a volume instead" }}
{{- end }}
{{/*
The tenant folder, as one Secret.

Why a Secret and not a ConfigMap: tenant.json holds literal API keys. The
runtime does no ${VAR} expansion — `llm_options.api_key` is the key itself — so
the file *is* the credential and there is no split to make.

Keys can't contain slashes, so `data/service_account.json` is stored as
`data__service_account.json` and projected back to its real path by the volume
items in job.yaml.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seo-os.tenantSecretName" . }}
  labels:
    {{- include "seo-os.labels" . | nindent 4 }}
  {{- with .Values.tenant.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  tenant.json: {{ default (toPrettyJson .Values.tenant.config) .Values.tenant.configJson | quote }}
  {{- if or .Values.tenant.input .Values.tenant.inputJson }}
  input.json: {{ default (toPrettyJson .Values.tenant.input) .Values.tenant.inputJson | quote }}
  {{- end }}
  {{- range $path, $contents := .Values.tenant.files }}
  {{ include "seo-os.tenantSecretKey" $path }}: {{ $contents | quote }}
  {{- end }}
{{- end }}
